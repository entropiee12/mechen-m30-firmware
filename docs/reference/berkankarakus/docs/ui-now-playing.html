<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MECHEN M30 · Now Playing UI concept</title>
<style>
:root { color-scheme: dark; --bg:#101316; --panel:#191e22; --text:#f3f2ee; --muted:#a7adb0; --red:#d00000; --line:#343a3e; }
* { box-sizing:border-box }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:#07090a; color:var(--text); font:14px/1.25 system-ui,-apple-system,sans-serif; }
.player { width:320px; height:240px; overflow:hidden; padding:12px 15px 10px; background:var(--bg); display:flex; flex-direction:column; gap:7px; border:1px solid #42484c; }
.top { height:20px; display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
.state { display:flex; align-items:center; gap:7px; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 8px #d0000070; }
.format { border:1px solid #454b4f; border-radius:3px; padding:2px 5px; letter-spacing:.06em; }
.identity { min-width:0; padding-top:2px; }
.track { overflow:hidden; white-space:nowrap; font-size:19px; line-height:1.18; font-weight:650; letter-spacing:-.025em; }
.track span { display:inline-block; }
.artist { margin-top:4px; color:#d2d3d1; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.album { margin-top:2px; color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wave { height:34px; display:flex; align-items:center; gap:3px; padding:0 3px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.wave i { display:block; width:3px; height:var(--h); max-height:22px; border-radius:2px; background:#777f83; opacity:.8; }
.wave i:nth-child(-n+11) { background:var(--red); opacity:1; }
.progress { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:10px; font-variant-numeric:tabular-nums; }
.rail { height:3px; flex:1; background:#3b4145; border-radius:3px; overflow:hidden; }
.fill { width:42%; height:100%; background:var(--red); }
.controls { height:39px; display:flex; align-items:center; justify-content:center; gap:25px; }
.btn { width:22px; height:22px; display:grid; place-items:center; color:#c5c9c9; font-size:15px; }
.play { width:34px; height:34px; border-radius:50%; color:white; background:var(--red); font-size:15px; box-shadow:0 2px 8px #0008; }
.bottom { margin-top:auto; height:20px; border-top:1px solid var(--line); display:flex; align-items:end; justify-content:space-between; color:var(--muted); font-size:10px; }
.count { color:#e4e2de; }
.hint { letter-spacing:.04em; }
@media (prefers-reduced-motion:no-preference) {
  .track.marquee span { padding-right:28px; animation:marquee 9s linear 1s infinite; }
  @keyframes marquee { to { transform:translateX(-55%); } }
}
</style>
</head>
<body>
<main class="player" aria-label="M30 now playing concept">
  <header class="top"><div class="state"><b class="dot"></b><span>Now playing</span></div><span class="format">FLAC</span></header>
  <section class="identity"><div class="track marquee"><span>The Less I Know the Better&nbsp;&nbsp; · &nbsp;&nbsp;The Less I Know the Better</span></div><div class="artist">Tame Impala</div><div class="album">Currents · 2015</div></section>
  <div class="wave" aria-hidden="true"><i style="--h:7px"></i><i style="--h:13px"></i><i style="--h:9px"></i><i style="--h:18px"></i><i style="--h:12px"></i><i style="--h:21px"></i><i style="--h:15px"></i><i style="--h:8px"></i><i style="--h:17px"></i><i style="--h:11px"></i><i style="--h:20px"></i><i style="--h:12px"></i><i style="--h:6px"></i><i style="--h:16px"></i><i style="--h:9px"></i><i style="--h:19px"></i><i style="--h:11px"></i><i style="--h:7px"></i><i style="--h:14px"></i><i style="--h:10px"></i><i style="--h:18px"></i><i style="--h:8px"></i><i style="--h:13px"></i><i style="--h:6px"></i><i style="--h:16px"></i><i style="--h:9px"></i><i style="--h:12px"></i><i style="--h:7px"></i><i style="--h:17px"></i><i style="--h:10px"></i><i style="--h:14px"></i><i style="--h:6px"></i><i style="--h:19px"></i><i style="--h:8px"></i><i style="--h:12px"></i><i style="--h:7px"></i><i style="--h:15px"></i><i style="--h:9px"></i><i style="--h:18px"></i><i style="--h:6px"></i><i style="--h:13px"></i><i style="--h:8px"></i><i style="--h:16px"></i><i style="--h:10px"></i><i style="--h:7px"></i><i style="--h:14px"></i><i style="--h:9px"></i><i style="--h:17px"></i><i style="--h:6px"></i><i style="--h:12px"></i></div>
  <div class="progress"><span>1:32</span><div class="rail"><div class="fill"></div></div><span>3:36</span></div>
  <nav class="controls" aria-label="Playback controls"><span class="btn">⇄</span><span class="btn">|◀</span><span class="btn play">▶</span><span class="btn">▶|</span><span class="btn">↻</span></nav>
  <footer class="bottom"><span class="count">Played 18 times</span><span class="hint">WHEEL · BROWSE</span></footer>
</main>
</body>
</html>
